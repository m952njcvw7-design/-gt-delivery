<!-- ÁREA DE CADASTRO DE LOJAS -->
<section id="cadastro-lojas" style="padding:20px;">
  <h2>🏪 Cadastrar loja</h2>

  <input id="nomeLoja" type="text" placeholder="Nome da loja"
    style="width:100%;padding:12px;margin:6px 0;">

  <input id="categoriaLoja" type="text" placeholder="Categoria"
    style="width:100%;padding:12px;margin:6px 0;">

  <input id="enderecoLoja" type="text" placeholder="Endereço"
    style="width:100%;padding:12px;margin:6px 0;">

  <input id="whatsappLoja" type="tel" placeholder="WhatsApp"
    style="width:100%;padding:12px;margin:6px 0;">

  <button onclick="cadastrarLoja()"
    style="width:100%;padding:14px;margin-top:10px;">
    ➕ Cadastrar loja
  </button>

  <div id="listaLojas" style="margin-top:20px;"></div>
</section>

<script>
function cadastrarLoja() {
  const nome = document.getElementById("nomeLoja").value.trim();
  const categoria = document.getElementById("categoriaLoja").value.trim();
  const endereco = document.getElementById("enderecoLoja").value.trim();
  const whatsapp = document.getElementById("whatsappLoja").value.trim();

  if (!nome) {
    alert("Digite o nome da loja.");
    return;
  }

  const lojas = JSON.parse(
    localStorage.getItem("gt_delivery_lojas") || "[]"
  );

  lojas.push({
    nome: nome,
    categoria: categoria,
    endereco: endereco,
    whatsapp: whatsapp
  });

  localStorage.setItem(
    "gt_delivery_lojas",
    JSON.stringify(lojas)
  );

  alert("Loja cadastrada com sucesso!");

  document.getElementById("nomeLoja").value = "";
  document.getElementById("categoriaLoja").value = "";
  document.getElementById("enderecoLoja").value = "";
  document.getElementById("whatsappLoja").value = "";

  mostrarLojas();
}

function mostrarLojas() {
  const lojas = JSON.parse(
    localStorage.getItem("gt_delivery_lojas") || "[]"
  );

  const lista = document.getElementById("listaLojas");

  lista.innerHTML = lojas.map((loja) => `
    <div style="padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;">
      <strong>🏪 ${loja.nome}</strong><br>
      Categoria: ${loja.categoria || "Não informada"}<br>
      Endereço: ${loja.endereco || "Não informado"}<br>
      WhatsApp: ${loja.whatsapp || "Não informado"}
    </div>
  `).join("");
}

document.addEventListener("DOMContentLoaded", mostrarLojas);
</script>
